# SDLPP (no SR/CB) + SURE classifier (Feng & An, AAAI'19).
model:
  name: sdlpp
  params:
    T: 100
    target_d: 13
    k: 8
    miu: 0.1
    thr: 0.95

disambig:
  name: knn_propagation
  params:
    use_sample_reliability: false
    use_class_balance: false

classifier:
  name: sure
  params:
    lambda: 0.1
    beta: 0.1
    max_iter: 50
    tol: 0.0001

method_tag: sdlpp_sure_baseline
