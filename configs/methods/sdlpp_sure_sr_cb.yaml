# SDLPP + SR + CB + SURE classifier (Feng & An, AAAI'19).
model:
  name: sdlpp
  params:
    T: 100
    target_d: 13
    k: 8
    miu: 0.1
    thr: 0.95

disambig:
  name: knn_propagation
  params:
    use_sample_reliability: true
    use_class_balance: true
    r_min: 0.1
    warmup: 5
    warmup_by_dataset:
      MSRCv2: 2
      Mirflickr: 0
      slashdotpl-f1: 0
      Soccer Player: 2
      Yahoo! News: 3
    alpha: 0.5

classifier:
  name: sure
  params:
    lambda: 0.1
    beta: 0.1
    max_iter: 50
    tol: 0.0001

method_tag: sdlpp_sure_sr_cb
